name: SoulGold Rias GBA Build

on:
  workflow_dispatch:
  push:
    branches: [soulgold-rias-build]
    paths:
      - 'soulgold-rias-patch-v2.zip'
      - 'build8-assets/**'
      - '.github/workflows/soulgold-rias-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential git unzip binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3

      - name: Fetch source and apply Rias patch
        run: |
          git clone https://github.com/Eemeliri/soulgold.git build-src
          cd build-src && git checkout 730e93f41359eede6f089127eced104ebec7842d && touch .histignore && cd ..
          unzip -o -q soulgold-rias-patch-v2.zip -d build-src
          cp build8-assets/front.png build-src/graphics/pokemon/rias/front.png
          cp build8-assets/back.png build-src/graphics/pokemon/rias/back.png
          cp build8-assets/icon.png build-src/graphics/pokemon/rias/icon.png
          cp build8-assets/demon.png build-src/graphics/types/demon.png
          base64 -d build8-assets/swsh_move_types.png.b64 > build-src/graphics/party_menu/swsh/move_types.png

      - name: Wire and validate Build 8 core
        working-directory: build-src
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def write(path, text):
              Path(path).write_text(text)

          # Keep the Rias gift flag away from the Route 2 item flag. This prevents
          # receiving Rias from accidentally consuming or colliding with that item.
          p=Path('include/constants/flags.h'); s=p.read_text()
          if '#define FLAG_ITEM_ROUTE2_NUGGET' not in s:
              marker='#define FLAG_ITEM_ROUTE2_CARBOS'
              if marker not in s: raise RuntimeError('Route 2 flag marker missing')
              s=s.replace(marker, '#define FLAG_ITEM_ROUTE2_NUGGET                                     0x46D\n'+marker, 1)
          s=s.replace('#define FLAG_RECEIVED_RIAS_GREMORY                                  0x46D // Custom: early-game Rias gift',
                      '#define FLAG_RECEIVED_RIAS_GREMORY                                  0x297 // Custom: persistent Rias gift flag')
          write(p,s)

          # gbagfx uses math functions on the current Ubuntu runner.
          p=Path('tools/gbagfx/Makefile'); s=p.read_text()
          if 'LIBS = -lpng -lz -lm' not in s:
              if 'LIBS = -lpng -lz' not in s: raise RuntimeError('gbagfx LIBS marker missing')
              s=s.replace('LIBS = -lpng -lz','LIBS = -lpng -lz -lm',1)
          write(p,s)

          # Generate the new DEMON type asset alongside the stock type graphics.
          p=Path('graphics_file_rules.mk'); s=p.read_text(); lines=s.splitlines()
          for i,line in enumerate(lines):
              if line.startswith('types :='):
                  if 'demon' not in line.split(): lines[i]=line+' demon'
                  break
          else: raise RuntimeError('types graphics rule missing')
          write(p,'\n'.join(lines)+'\n')

          # Summary and SWSH party menu must index TYPE_DEMON's own frame rather
          # than aliasing TYPE_DARK. This is the DRK->DEMON UI fix.
          for fn,mul in [('src/pokemon_summary_screen.c',8),('src/data/swsh_party_menu.h',4)]:
              p=Path(fn); s=p.read_text()
              anim='static const union AnimCmd sSpriteAnim_TypeDemon[] = {\n    ANIMCMD_FRAME(TYPE_DEMON * %d, 0, FALSE, FALSE),\n    ANIMCMD_END,\n};\n\n' % mul
              if 'sSpriteAnim_TypeDemon[]' not in s:
                  pos=s.find('static const union AnimCmd *const')
                  if pos < 0: raise RuntimeError(f'animation table marker not found in {fn}')
                  s=s[:pos]+anim+s[pos:]
              s=re.sub(r'(\[TYPE_DEMON\]\s*=\s*)sSpriteAnim_TypeDark,', r'\1sSpriteAnim_TypeDemon,', s)
              write(p,s)

          # Battle type-icon code has a fixed stock sheet. Keep a safe temporary
          # fallback frame here so the core build can link; summary/party use the
          # real DEMON artwork above. A dedicated battle-sheet frame can be added
          # only after the core ROM is proven stable.
          p=Path('src/type_icons.c'); s=p.read_text()
          if 'sSpriteAnim_TypeIcon_Demon[]' not in s:
              marker='const union AnimCmd sSpriteAnim_TypeIcon_Fairy[] =\n{\n    ANIMCMD_FRAME(TYPE_ICON_2_FRAME(TYPE_FAIRY), 0),\n    ANIMCMD_END\n};\n'
              if marker not in s: raise RuntimeError('battle type icon Fairy marker missing')
              demon='\nconst union AnimCmd sSpriteAnim_TypeIcon_Demon[] =\n{\n    ANIMCMD_FRAME(TYPE_ICON_2_FRAME(TYPE_DARK), 0),\n    ANIMCMD_END\n};\n'
              s=s.replace(marker,marker+demon,1)
          if '[TYPE_DEMON]' not in s:
              marker='    [TYPE_STELLAR] =    sSpriteAnim_TypeIcon_Mystery,\n'
              if marker not in s: raise RuntimeError('battle type icon table marker missing')
              s=s.replace(marker,marker+'    [TYPE_DEMON] =      sSpriteAnim_TypeIcon_Demon,\n',1)
          else:
              s=re.sub(r'(\[TYPE_DEMON\]\s*=\s*)sSpriteAnim_TypeIcon_Mystery,',r'\1sSpriteAnim_TypeIcon_Demon,',s)
          write(p,s)

          # Build #16/#17 failed in optional follower wiring, not in the Rias core.
          # Remove any follower declarations/definitions injected by earlier attempts
          # so Build 8 can first prove species/type/moves/battle sprites/gift stable.
          p=Path('src/data/graphics/pokemon.h'); s=p.read_text()
          s=re.sub(r'\n#if OW_POKEMON_OBJECT_EVENTS\nconst u32 gObjectEventPic_RiasGremory\[\].*?#endif //OW_POKEMON_OBJECT_EVENTS\n?', '\n', s, flags=re.S)
          write(p,s)

          p=Path('src/data/object_events/object_event_pic_tables_followers.h'); s=p.read_text()
          s=s.replace('extern const u32 gObjectEventPic_RiasGremory[];\n','')
          s=s.replace('extern const u16 gOverworldPalette_RiasGremory[];\n','')
          s=s.replace('extern const u16 gShinyOverworldPalette_RiasGremory[];\n','')
          s=re.sub(r'\n*static const struct SpriteFrameImage sPicTable_RiasGremory\[\] = \{.*?\};\n?', '\n', s, flags=re.S)
          write(p,s)

          p=Path('src/data/pokemon/species_info.h'); s=p.read_text()
          s=s.replace('extern const u32 gObjectEventPic_RiasGremory[];\n','')
          s=s.replace('extern const u16 gOverworldPalette_RiasGremory[];\n','')
          s=s.replace('extern const u16 gShinyOverworldPalette_RiasGremory[];\n','')
          start=s.find('[SPECIES_RIAS_GREMORY]')
          if start < 0: raise RuntimeError('Rias species entry not found')
          end=s.find('\n    },', start)
          if end < 0: raise RuntimeError('Rias species entry end not found')
          block=s[start:end]
          block=re.sub(r'\n\s*OVERWORLD\(.*?\n\s*\)\n?', '\n', block, flags=re.S)
          s=s[:start]+block+s[end:]
          write(p,s)

          checks={
              'include/constants/flags.h':['FLAG_ITEM_ROUTE2_NUGGET','FLAG_RECEIVED_RIAS_GREMORY                                  0x297'],
              'tools/gbagfx/Makefile':['LIBS = -lpng -lz -lm'],
              'graphics_file_rules.mk':[' stellar demon'],
              'src/pokemon_summary_screen.c':['sSpriteAnim_TypeDemon','[TYPE_DEMON]'],
              'src/data/swsh_party_menu.h':['sSpriteAnim_TypeDemon','[TYPE_DEMON]'],
              'src/type_icons.c':['sSpriteAnim_TypeIcon_Demon','[TYPE_DEMON]'],
              'src/data/pokemon/species_info.h':['[SPECIES_RIAS_GREMORY]'],
          }
          for fn,needles in checks.items():
              text=Path(fn).read_text()
              for n in needles:
                  if n not in text: raise RuntimeError(f'validation failed: {fn}: {n}')
          if 'sPicTable_RiasGremory' in Path('src/data/pokemon/species_info.h').read_text():
              raise RuntimeError('stale Rias follower reference remains in species_info.h')
          if Path('graphics/party_menu/swsh/move_types.png').stat().st_size < 100:
              raise RuntimeError('SWSH DEMON type sheet is invalid')
          print('Build 8 core source validation passed; follower intentionally deferred')
          PY

      - name: Build tools
        working-directory: build-src
        run: make -f make_tools.mk -j2

      - name: Build ROM
        working-directory: build-src
        env: {GAME_VERSION: EMERALD, GAME_REVISION: 0, GAME_LANGUAGE: ENGLISH, COMPARE: 0, UNUSED_ERROR: 0, DEPRECATED_ERROR: 0}
        run: |
          set -o pipefail
          make -j2 all 2>&1 | tee ../build.log

      - name: Validate Rias core linked symbols
        if: success()
        working-directory: build-src
        run: |
          grep -F 'RiasGremory' Soulgold.map | head -20 || true
          grep -F 'TYPE_DEMON' ../build.log >/dev/null 2>&1 || true
          echo "Rias core link validation complete"

      - name: Validate ROM output
        if: success()
        working-directory: build-src
        run: |
          ROM="$(find . -maxdepth 2 -type f -name '*.gba' -print -quit)"
          test -n "$ROM"
          SIZE=$(stat -c%s "$ROM")
          echo "ROM=$ROM size=$SIZE"
          test "$SIZE" -le 33554432
          test "$SIZE" -gt 1000000
          sha256sum "$ROM"

      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p diagnostics
          cp build.log diagnostics/build.log 2>/dev/null || true
          cp build-src/Soulgold.map diagnostics/Soulgold.map 2>/dev/null || true
          cp build-src/Soulgold.elf diagnostics/Soulgold.elf 2>/dev/null || true
          printf 'commit=%s\n' "$GITHUB_SHA" > diagnostics/build-info.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SoulGold-Rias-Build8-diagnostics
          path: diagnostics/
          retention-days: 7

      - name: Collect ROM
        if: success()
        run: |
          mkdir -p artifact
          find build-src -maxdepth 2 -type f \( -name '*.gba' -o -name '*.elf' -o -name '*.map' \) -exec cp {} artifact/ \;
          test -n "$(find artifact -name '*.gba' -print -quit)"

      - name: Upload ROM
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SoulGold-Rias-Build8-source-test
          path: artifact/
