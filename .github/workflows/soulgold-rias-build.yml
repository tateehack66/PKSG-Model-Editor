name: SoulGold Rias GBA Build

on:
  workflow_dispatch:
  push:
    branches:
      - soulgold-rias-build
    paths:
      - 'soulgold-rias-patch-v2.zip'
      - '.github/workflows/soulgold-rias-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PKSG build branch
        uses: actions/checkout@v4

      - name: Check Rias patch
        run: |
          test -f soulgold-rias-patch-v2.zip || { echo 'Upload soulgold-rias-patch-v2.zip to this branch first.'; exit 1; }

      - name: Install ARM GBA toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential git unzip binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3

      - name: Fetch matching SoulGold source
        run: |
          git clone https://github.com/Eemeliri/soulgold.git build-src
          cd build-src
          git checkout 730e93f41359eede6f089127eced104ebec7842d
          touch .histignore

      - name: Apply Rias / DEMON patch
        run: unzip -o -q soulgold-rias-patch-v2.zip -d build-src

      - name: Build project tools first
        working-directory: build-src
        run: |
          set -o pipefail
          echo 'Building native SoulGold asset/preprocessor tools first.'
          make -f make_tools.mk -j2 2>&1 | tee ../tools-build.log

      - name: Verify required build tools
        working-directory: build-src
        run: |
          echo 'Checking host tools used by this source tree.'
          missing=0
          for tool in tools/preproc/preproc tools/gbagfx/gbagfx tools/png_dimensions/png_dimensions tools/gfx/gfx; do
            if [ -e "$tool" ]; then
              echo "FOUND: $tool"
            else
              echo "NOT PRESENT (may not be used by this source revision): $tool"
            fi
          done
          test -x tools/preproc/preproc || missing=1
          if [ "$missing" -ne 0 ]; then
            echo 'Required preproc tool was not built.'
            exit 1
          fi

      - name: Build ROM
        working-directory: build-src
        env:
          GAME_VERSION: EMERALD
          GAME_REVISION: 0
          GAME_LANGUAGE: ENGLISH
          COMPARE: 0
          UNUSED_ERROR: 0
          DEPRECATED_ERROR: 0
        run: |
          set -o pipefail
          echo 'Building with 2 parallel jobs to reduce runner memory pressure.'
          make -j2 all 2>&1 | tee ../build.log

      - name: Show build failure tail
        if: failure()
        run: |
          echo '===== TOOLS BUILD LOG (LAST 150 LINES) ====='
          tail -n 150 tools-build.log 2>/dev/null || true
          echo '===== ROM BUILD LOG (LAST 250 LINES) ====='
          tail -n 250 build.log 2>/dev/null || true
          echo '===== ERROR MATCHES ====='
          grep -nEi 'error:|fatal:|not found|undefined reference|no rule to make target|make(\[[0-9]+\])?: \*\*\*' tools-build.log build.log 2>/dev/null | tail -n 150 || true

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SoulGold-Rias-build-log
          path: |
            tools-build.log
            build.log
          if-no-files-found: warn

      - name: Collect ROM
        if: success()
        run: |
          mkdir -p artifact
          find build-src -maxdepth 2 -type f \( -name '*.gba' -o -name '*.elf' -o -name '*.map' \) -exec cp {} artifact/ \;
          test -n "$(find artifact -name '*.gba' -print -quit)" || { echo 'No GBA ROM was produced.'; exit 1; }

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SoulGold-Rias-DEMON-build
          path: artifact/
          if-no-files-found: error
